name: Deploy Notebook Index
 
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
 
      - name: Build site files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
 
      - name: Deploy to gh-pages subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true