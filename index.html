<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e7">
  <title>Public Notebook</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e7;
      --ink: #222b28;
      --muted: #65716b;
      --rule: #d8d2c4;
      --accent: #176b59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: repeating-linear-gradient(0deg, transparent 0 31px, rgba(73, 99, 86, .08) 31px 32px), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(760px, 100%); margin: 0 auto; padding: 72px 28px 56px; }
    .kicker { margin: 0 0 12px; color: var(--accent); font: 700 12px/1.4 "Courier New", monospace; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(44px, 9vw, 76px); line-height: .98; font-weight: 500; }
    .intro { max-width: 42ch; margin: 24px 0 48px; color: var(--muted); font-size: 19px; line-height: 1.55; }
    h2 { margin: 0 0 12px; font: 700 12px/1.4 "Courier New", monospace; text-transform: uppercase; }
    ol { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
    li { border-bottom: 1px solid var(--rule); }
    li a { display: flex; align-items: center; gap: 18px; min-height: 72px; color: var(--ink); text-decoration: none; font-size: 20px; }
    li a:hover .label, li a:focus-visible .label { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
    .number { color: var(--muted); font: 14px "Courier New", monospace; }
    .arrow { margin-left: auto; color: var(--accent); font: 22px "Courier New", monospace; }
    footer { margin-top: 44px; color: var(--muted); font: 12px/1.5 "Courier New", monospace; }
    @media (max-width: 520px) { main { padding: 48px 22px 40px; } .intro { margin-bottom: 36px; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">A collection of small pages</p>
    <h1>Public<br>Notebook</h1>
    <p class="intro">Hello, world! This notebook is a simple home for standalone HTML pages, ready to grow one note at a time.</p>
    <section aria-labelledby="pages-heading">
      <h2 id="pages-heading">Pages</h2>
      <ol>
        <li><a href="page-one.html"><span class="number">01</span><span class="label">First page</span><span class="arrow" aria-hidden="true">↗</span></a></li>
        <li><a href="page-two.html"><span class="number">02</span><span class="label">Second page</span><span class="arrow" aria-hidden="true">↗</span></a></li>
        <li><a href="page-three.html"><span class="number">03</span><span class="label">Third page</span><span class="arrow" aria-hidden="true">↗</span></a></li>
      </ol>
    </section>
    <footer>PUBLIC-NOTEBOOK · HTML / CSS · GITHUB PAGES</footer>
  </main>
</body>
</html>
