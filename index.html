<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#17222b;--mute:#5b6b76;--line:#d3dde3;--acc:#0b6b73;--tint:#dcecee}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10181d;--card:#182229;--ink:#e6eef2;--mute:#93a5b0;--line:#2b3a43;--acc:#5cc6cf;--tint:#1c3a40}}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:2rem 1rem 4rem}
main{max-width:44rem;margin:0 auto}
h1{font:700 2.6rem/1.05 Georgia,"Times New Roman",serif;margin:0 0 .4rem;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 1.5rem}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
input[type=search]{flex:1 1 12rem;padding:.55rem .75rem;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px}
input[type=search]:focus-visible,.tag:focus-visible,.note:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{font:inherit;font-size:.85rem;padding:.35rem .8rem;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.tag[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.note{display:grid;grid-template-columns:.6rem 1fr auto;gap:0 1rem;align-items:baseline;padding:1rem .25rem 1rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.note::before{content:"";grid-row:1/3;align-self:stretch;background:var(--acc);border-radius:2px;opacity:.35;transition:opacity .15s}
.note:hover::before,.note:focus-visible::before{opacity:1}
.note:hover h2,.note:focus-visible h2{text-decoration:underline}
h2{font:700 1.3rem/1.25 Georgia,serif;margin:0;grid-column:2}
.meta{color:var(--mute);font-size:.85rem;text-align:right;grid-column:3;grid-row:1}
.desc{grid-column:2/4;margin:.2rem 0 0;color:var(--mute)}
.chip{display:inline-block;background:var(--tint);border-radius:99px;padding:0 .55rem;margin-right:.4rem;font-size:.8rem}
.tagrow{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.lbl{color:var(--mute);font-size:.9rem}
.empty{padding:1.25rem 0;color:var(--mute)}
@media(max-width:30rem){.note{grid-template-columns:.6rem 1fr}.meta{grid-column:2;grid-row:auto;text-align:left}.desc{grid-column:2}}
</style>
</head>
<body>
<main>
<h1>Notes</h1>
<p class="sub" id="count"></p>
<div class="tools">
  <input type="search" id="q" placeholder="Search notes" aria-label="Search notes">
  <div class="tagrow"><span class="lbl" id="lbl">Filter by tag:</span><span id="tags" role="group" aria-labelledby="lbl"></span></div>
</div>
<ul id="list"></ul>
<p class="empty" id="none" hidden>No notes match. Try a different search or clear the tag filter.</p>
</main>
<script>
// To add a note: save it as an .html file next to this page, then add a line here.
const notes=[
 {title:"Board game shelf",href:"board-games.html",desc:"Some of my games, grouped by co-op and competitive, sortable by time, players and complexity. Compiled by Claude",tags:["games", "ai-claude"],date:"2026-09-30"}
];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let tag=null;
const allTags=[...new Set(notes.flatMap(n=>n.tags))].sort();
$("tags").innerHTML=allTags.map(t=>`<button class="tag" aria-pressed="false" data-t="${esc(t)}">${esc(t)}</button>`).join(" ");
$("tags").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  tag=tag===b.dataset.t?null:b.dataset.t;
  document.querySelectorAll(".tag").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===tag));
  render();
});
$("q").addEventListener("input",render);
function render(){
  const q=$("q").value.trim().toLowerCase();
  const shown=notes.filter(n=>(!tag||n.tags.includes(tag))&&(!q||(n.title+" "+n.desc+" "+n.tags.join(" ")).toLowerCase().includes(q)))
    .sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title));
  $("list").innerHTML=shown.map(n=>`<li><a class="note" href="${esc(n.href)}"><h2>${esc(n.title)}</h2><span class="meta">${n.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}${new Date(n.date+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span><p class="desc">${esc(n.desc)}</p></a></li>`).join("");
  $("none").hidden=shown.length>0;
  $("count").textContent=notes.length+(notes.length===1?" note":" notes")+(shown.length!==notes.length?", "+shown.length+" shown":"");
}
render();
</script>
</body>
</html>
