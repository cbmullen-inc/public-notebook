<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Page · Public Notebook</title>
  <style>
    :root { --paper: #f4f0e7; --ink: #222b28; --muted: #65716b; --rule: #d8d2c4; --accent: #176b59; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: repeating-linear-gradient(0deg, transparent 0 31px, rgba(73, 99, 86, .08) 31px 32px), var(--paper); font-family: Georgia, "Times New Roman", serif; }
    main { width: min(680px, 100%); margin: 0 auto; padding: 72px 28px 56px; }
    nav a { color: var(--accent); font: 700 12px/1.4 "Courier New", monospace; text-decoration: none; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    .kicker { margin: 72px 0 12px; color: var(--muted); font: 700 12px/1.4 "Courier New", monospace; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(40px, 8vw, 64px); line-height: 1; font-weight: 500; }
    .note { margin-top: 32px; padding: 22px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 20px; line-height: 1.6; }
    footer { margin-top: 36px; color: var(--muted); font: 12px/1.5 "Courier New", monospace; }
    @media (max-width: 520px) { main { padding: 48px 22px 40px; } .kicker { margin-top: 56px; } }
  </style>
</head>
<body>
  <main>
    <nav><a href="index.html">← Public Notebook</a></nav>
    <p class="kicker">Page 01</p>
    <h1>First page</h1>
    <p class="note">Hello, world! This is the first page in the public notebook.</p>
    <footer>PUBLIC-NOTEBOOK · PAGE 01</footer>
  </main>
</body>
</html>
